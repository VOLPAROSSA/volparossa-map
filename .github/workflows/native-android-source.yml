name: Organic Maps Android source build
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/native-android-source.yml
      - integrations/my-position/**
      - upstream.lock.json
      - tests/native-toolchains/checkout.sh
      - tests/offline-route/inputs.json
      - tests/offline-route/inputs.py
      - tests/offline-route/android.py
      - tests/offline-route/emulator.sh
      - tests/offline-route/run_guest.py
permissions:
  contents: read
concurrency:
  group: map-current-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Source-built WebDebug on the offline Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the ordinary application and instrumented tests
        run: |
          set -euo pipefail
          bash tests/native-toolchains/checkout.sh "$RUNNER_TEMP/organic-source"
          core="$RUNNER_TEMP/dps-core"
          pin=$(cat integrations/my-position/core-revision)
          [[ $pin =~ ^[0-9a-f]{40}$ ]]
          git init -q "$core"
          git -C "$core" fetch --depth=1 https://github.com/VOLPAROSSA/volparossa.git "$pin"
          git -C "$core" checkout --quiet --detach FETCH_HEAD
          bash integrations/my-position/assemble.sh "$RUNNER_TEMP/organic-source" "$core" x86_64
          trial=$(mktemp -d "$RUNNER_TEMP/map-quality.XXXXXX")
          echo "ROUTE_TRIAL=$trial" >> "$GITHUB_ENV"
          apkdir="$RUNNER_TEMP/organic-source/android/app/build/outputs/apk"
          mapfile -t apks < <(find "$apkdir/web/debug" -maxdepth 1 -name '*.apk' -type f)
          mapfile -t tests < <(find "$apkdir/androidTest/web/debug" -maxdepth 1 -name '*.apk' -type f)
          [[ ${#apks[@]} -eq 1 && ${#tests[@]} -eq 1 ]]
          python3 -B tests/offline-route/inputs.py "$trial" --upstream "$RUNNER_TEMP/organic-source" --built-apk "${apks[0]}"
          install -m 0600 "${tests[0]}" "$trial/map-quality-tests.apk"
          cp integrations/my-position/core-revision "$trial/map-quality-core"
      - name: Exercise both ordinary routes and the My Position permission and expiry checks
        run: |
          bash tests/offline-route/emulator.sh web-debug-quality
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organic-maps-source-android
          path: ${{ env.ROUTE_TRIAL }}/receipt.json
          if-no-files-found: error
