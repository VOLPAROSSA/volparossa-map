name: Organic Maps Android source build
on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/native-android-source.yml
      - upstream.lock.json
      - tests/native-toolchains/checkout.sh
      - tests/offline-route/inputs.json
      - tests/offline-route/inputs.py
      - tests/offline-route/android.py
      - tests/offline-route/emulator.sh
      - tests/offline-route/run-guest.sh
permissions:
  contents: read

jobs:
  android:
    name: Source-built WebDebug on the offline Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the native x86-64 app from the exact source
        run: |
          set -euo pipefail
          bash tests/native-toolchains/checkout.sh "$RUNNER_TEMP/organic-source"
          trial=$(mktemp -d "$RUNNER_TEMP/organic-android.XXXXXX")
          echo "ROUTE_TRIAL=$trial" >> "$GITHUB_ENV"
          (
            cd "$RUNNER_TEMP/organic-source/android"
            ./gradlew --no-daemon -Px86_64 :app:assembleWebDebug
          )
          mapfile -t apks < <(find "$RUNNER_TEMP/organic-source/android/app/build/outputs/apk/web/debug" -maxdepth 1 -name '*.apk' -type f)
          [[ ${#apks[@]} -eq 1 ]]
          python3 -B tests/offline-route/inputs.py "$trial" --upstream "$RUNNER_TEMP/organic-source" --built-apk "${apks[0]}"
      - name: Install the source-built package and use both real pedestrian routes after cold starts
        run: bash tests/offline-route/emulator.sh web-debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organic-maps-source-android
          path: ${{ env.ROUTE_TRIAL }}/receipt.json
          if-no-files-found: error
