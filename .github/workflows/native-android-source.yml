name: Organic Maps Android source build
on:
  workflow_dispatch:
    inputs:
      abi:
        description: Native libraries and installed application ABI
        type: choice
        default: x86_64
        options: [x86_64, arm64-v8a]
  workflow_call:
    inputs:
      abi:
        type: string
        default: x86_64
  pull_request:
    paths:
      - .github/workflows/native-android-source.yml
      - integrations/my-position/**
      - upstream.lock.json
      - tests/native-toolchains/checkout.sh
      - tests/offline-route/inputs.json
      - tests/offline-route/inputs.py
      - tests/offline-route/android.py
      - tests/offline-route/my_position.py
      - tests/offline-route/emulator.sh
      - tests/offline-route/run_guest.py
permissions:
  contents: read
concurrency:
  # An explicit rerun of an earlier PR commit must not cancel the latest build.
  group: map-current-fix-${{ github.ref }}-${{ inputs.abi || 'x86_64' }}-${{ github.event_name == 'pull_request' && github.run_attempt > 1 && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  android:
    name: Source-built WebDebug on the offline Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      MAP_ANDROID_ABI: ${{ inputs.abi || 'x86_64' }}
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the ordinary application and instrumented tests
        run: |
          set -euo pipefail
          bash tests/native-toolchains/checkout.sh "$RUNNER_TEMP/organic-source"
          core="$RUNNER_TEMP/dps-core"
          pin=$(cat integrations/my-position/core-revision)
          [[ $pin =~ ^[0-9a-f]{40}$ ]]
          git init -q "$core"
          git -C "$core" fetch --depth=1 https://github.com/VOLPAROSSA/volparossa.git "$pin"
          git -C "$core" checkout --quiet --detach FETCH_HEAD
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865' 'platforms;android-36' 'build-tools;36.0.0'
          case "$MAP_ANDROID_ABI" in
            x86_64) target=x86_64-linux-android ;;
            arm64-v8a) target=aarch64-linux-android ;;
            *) exit 2 ;;
          esac
          rustup toolchain install 1.89.0 --profile minimal --target "$target"
          bash integrations/my-position/assemble.sh "$RUNNER_TEMP/organic-source" "$core" "$MAP_ANDROID_ABI"
          trial=$(mktemp -d "$RUNNER_TEMP/map-quality.XXXXXX")
          echo "ROUTE_TRIAL=$trial" >> "$GITHUB_ENV"
          apkdir="$RUNNER_TEMP/organic-source/android/app/build/outputs/apk"
          mapfile -t apks < <(find "$apkdir/web/debug" -maxdepth 1 -name '*.apk' -type f)
          mapfile -t tests < <(find "$apkdir/androidTest/web/debug" -maxdepth 1 -name '*.apk' -type f)
          [[ ${#apks[@]} -eq 1 && ${#tests[@]} -eq 1 ]]
          python3 - "${apks[0]}" "$RUNNER_TEMP/organic-source/android/app/src/main/assets/volparossa-licenses" <<'PYTHON'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          directory = Path(sys.argv[2])
          assert (directory / 'crates/DEPENDENCIES.tsv').stat().st_size > 0
          with ZipFile(sys.argv[1]) as apk:
              assert apk.getinfo(f'lib/{os.environ["MAP_ANDROID_ABI"]}/libvolparossa_map_quality.so').file_size > 0
              for original in directory.rglob('*'):
                  if original.is_file():
                      assert apk.read('assets/volparossa-licenses/' + str(original.relative_to(directory))) == original.read_bytes()
          PYTHON
          python3 -B tests/offline-route/inputs.py "$trial" --upstream "$RUNNER_TEMP/organic-source" --built-apk "${apks[0]}" --built-abi "$MAP_ANDROID_ABI"
          install -m 0600 "${tests[0]}" "$trial/map-quality-tests.apk"
          cp integrations/my-position/core-revision "$trial/map-quality-core"
      - name: Preserve source and ELF identities of the ARM64 application
        if: env.MAP_ANDROID_ABI == 'arm64-v8a' && !cancelled() && env.ROUTE_TRIAL != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organic-maps-arm64-build
          path: ${{ env.ROUTE_TRIAL }}/android-build.json
          if-no-files-found: error
      - name: Exercise both ordinary routes and the My Position permission and expiry checks
        run: |
          bash tests/offline-route/emulator.sh web-debug-quality
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organic-maps-source-android
          path: ${{ env.ROUTE_TRIAL }}/receipt.json
          if-no-files-found: error
      - name: Retain partial per-case observations when the installed app trial fails
        if: failure() && env.ROUTE_TRIAL != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-current-fix-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ROUTE_TRIAL }}/android-startup.json
            ${{ env.ROUTE_TRIAL }}/android-route-progress.json
            ${{ env.ROUTE_TRIAL }}/my-position-progress.json
          if-no-files-found: ignore
