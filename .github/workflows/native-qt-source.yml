name: Organic Maps Qt source build
on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/native-qt-source.yml
      - upstream.lock.json
      - tests/native-toolchains/checkout.sh
      - tests/offline-route/inputs.json
      - tests/offline-route/inputs.py
      - tests/native-toolchains/desktop.py
      - tests/native-toolchains/qt_session.py
permissions:
  contents: read

jobs:
  desktop:
    name: Original Qt desktop with software OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ubuntu
        uses: VOLPAROSSA/.github/actions/ubuntu-archive@e3f98bbc538f5df580b78c8a0d8bd932dfe3e381
      - name: Install Qt, Mesa and the build tools on this disposable runner
        env:
          UBUNTU_ARCHIVE_CONFIG: ${{ steps.ubuntu.outputs.config }}
        run: |
          sudo -n apt-get -c "$UBUNTU_ARCHIVE_CONFIG" update -qq
          sudo -n apt-get -c "$UBUNTU_ARCHIVE_CONFIG" install -y --no-install-recommends ninja-build qt6-base-dev qt6-positioning-dev libqt6svg6-dev \
            libgl1-mesa-dev libglvnd-dev libharfbuzz-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            xvfb xauth mesa-utils libgl1-mesa-dri xdotool python3-pil
      - name: Build the unmodified desktop from the pinned upstream source
        run: |
          set -euo pipefail
          bash tests/native-toolchains/checkout.sh "$RUNNER_TEMP/organic-source"
          cmake -S "$RUNNER_TEMP/organic-source" -B "$RUNNER_TEMP/organic-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_UNITY_BUILD=ON
          cmake --build "$RUNNER_TEMP/organic-build" --target desktop --parallel "$(nproc)"
      - name: Register three verified maps and render two offline Monaco views
        run: |
          set -euo pipefail
          trial=$(mktemp -d "$RUNNER_TEMP/organic-qt.XXXXXX")
          echo "DESKTOP_TRIAL=$trial" >> "$GITHUB_ENV"
          python3 -B tests/offline-route/inputs.py "$trial" --upstream "$RUNNER_TEMP/organic-source"
          sudo -n unshare --net -- /bin/bash -ceu '
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups --inh-caps=-all --ambient-caps=-all \
              --bounding-set=-all --no-new-privs --reset-env -- env GITHUB_SHA="$3" PATH=/usr/bin:/bin \
              xvfb-run -a -s "-screen 0 900x700x24 +extension GLX -nolisten tcp" \
              /usr/bin/python3 -B "$4/tests/native-toolchains/desktop.py" "$5/organic-build/OrganicMaps" "$5/organic-source" "$6"
          ' offline-desktop "$(id -u)" "$(id -g)" "$GITHUB_SHA" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$trial"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organic-maps-source-qt
          path: ${{ env.DESKTOP_TRIAL }}/receipt.json
          if-no-files-found: error
