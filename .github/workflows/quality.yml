name: Map integration components

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check traffic schema and core adapter contract
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check provenance JSON and whitespace
        run: |
          python3 -m json.tool upstream.lock.json > /dev/null
          git diff --check
